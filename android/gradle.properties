# Single Gradle JVM configuration for this project.
# Keep heap modest: C: drive free space is often tight on this machine.
# Prefer GRADLE_USER_HOME on a drive with free space (e.g. D:\gradle-home).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
org.gradle.parallel=true
org.gradle.caching=true

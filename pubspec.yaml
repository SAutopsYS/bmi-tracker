name: bmi_tracker
description: Professional BMI Health Tracker by IV Innovations Private Limited.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.2
  connectivity_plus: ^6.1.1
  csv: ^6.0.0
  share_plus: ^10.1.3
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.7
  collection: ^1.18.0
  go_router: ^14.6.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # .env.example is bundled so dotenv can fall back when .env is absent.
  # Keep secrets in a local .env (gitignored); do not list .env here.
  assets:
    - .env.example
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0F6B6B"
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true
